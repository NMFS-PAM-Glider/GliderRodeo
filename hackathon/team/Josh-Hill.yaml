bio: >-
  Dr. Joshua B. Hill is Director of the Institute for Advanced Analytics and Society (IAAS) at the University of Southern Mississippi, where he leads applied AI development for federal partners including NOAA. He directs AQUAVIEW, an oceanographic data platform that makes NOAA ocean and atmospheric datasets easier to discover, access, and use. He also leads the Enterprise Data Toolkit (EDT), an AI-powered platform for tracking how NOAA data products are used and what impact they have beyond the agency. His work centers on making federal environmental data more usable through AI, including emerging agent- and MCP-based approaches. He is also an Associate Professor at USM.
